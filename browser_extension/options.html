<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>TaskCalendar Browser Bridge</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 24px 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      p {
        margin: 0 0 16px;
        color: #5b6472;
        line-height: 1.5;
      }

      .card {
        background: #ffffff;
        border: 1px solid #d9e1ea;
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }

      textarea {
        width: 100%;
        min-height: 420px;
        resize: vertical;
        box-sizing: border-box;
        font-family: "Cascadia Code", "Consolas", monospace;
        font-size: 13px;
        line-height: 1.55;
        padding: 14px;
        border: 1px solid #cfd8e3;
        border-radius: 12px;
        background: #fbfdff;
        color: #111827;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      button {
        border: 1px solid #cfd8e3;
        background: #ffffff;
        color: #1f2937;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
      }

      button.primary {
        background: #1f7a67;
        border-color: #1f7a67;
        color: #ffffff;
        font-weight: 700;
      }

      .status {
        min-height: 24px;
        margin-top: 12px;
        font-size: 13px;
      }

      code {
        background: #eef4f8;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TaskCalendar Browser Bridge</h1>
      <p>
        아래 JSON에 대상 URL 패턴과 DOM selector를 넣으면, 해당 iframe/page 제목 옆에 <code>일정 추가하기</code>
        버튼이 생깁니다.
      </p>
      <p>
        기본 브리지는 <code>http://127.0.0.1:18452</code> 를 사용합니다. TaskCalendar 앱이 켜져 있어야 등록이 됩니다.
      </p>

      <section class="card">
        <textarea id="config-editor" spellcheck="false"></textarea>
        <div class="actions">
          <button id="reset-button" type="button">샘플로 되돌리기</button>
          <button id="save-button" class="primary" type="button">저장</button>
        </div>
        <div id="status" class="status"></div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
  </html>
