  <g>
    <rect x="242" y="322" width="10" height="14" class="npc2"/>
    <rect x="240" y="336" width="14" height="14" fill="#8ac06c"/>
    <rect x="244" y="318" width="6" height="4" class="line"/>
  </g>
  <g>
    <rect x="714" y="320" width="10" height="14" class="npc2"/>
    <rect x="712" y="334" width="14" height="14" fill="#b8c8e6"/>
    <rect x="716" y="316" width="6" height="4" class="line"/>
