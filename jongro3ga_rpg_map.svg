    <rect x="706" y="296" width="10" height="16" class="wood"/>
    <rect x="678" y="276" width="8" height="8" class="bannerR"/>
    <rect x="692" y="276" width="8" height="8" class="bannerY"/>
    <rect x="706" y="276" width="8" height="8" fill="#5c7c34"/>
  </g>
  <g>
    <rect x="420" y="424" width="54" height="34" class="stallA"/>
    <rect x="424" y="416" width="46" height="10" fill="#f3e7c6"/>
    <rect x="426" y="458" width="10" height="16" class="wood"/>
    <rect x="458" y="458" width="10" height="16" class="wood"/>
  </g>

  <!-- stone statues -->
  <g>
    <rect x="256" y="116" width="36" height="44" class="stone2"/>
    <rect x="248" y="158" width="52" height="18" class="stone"/>
    <rect x="266" y="94" width="16" height="22" class="stone"/>
    <rect x="260" y="88" width="28" height="10" class="stone2"/>
  </g>
  <g>
    <rect x="640" y="494" width="36" height="44" class="stone2"/>
    <rect x="632" y="536" width="52" height="18" class="stone"/>
    <rect x="650" y="472" width="16" height="22" class="stone"/>
    <rect x="644" y="466" width="28" height="10" class="stone2"/>
  </g>

