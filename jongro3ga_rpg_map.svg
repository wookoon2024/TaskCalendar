<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" shape-rendering="crispEdges">
  <defs>
    <style>
      .soil { fill: #b99872; }
      .grass { fill: #91a965; }
      .grass2 { fill: #7f9757; }
      .brick { fill: #9d7858; }
      .brick2 { fill: #846146; }
      .wood { fill: #875734; }
      .roof { fill: #5e3c2c; }
      .stone { fill: #b9b1a1; }
      .stone2 { fill: #968d7e; }
      .shadow { fill: #6d533f; opacity: .28; }
      .water { fill: #6b9fb1; }
      .bannerR { fill: #b9483e; }
      .bannerY { fill: #d4a83d; }
      .line { fill: #3f3126; }
      .stallA { fill: #4f86b7; }
      .stallB { fill: #d98a43; }
      .npc1 { fill: #e9d8bb; }
      .npc2 { fill: #2e3d57; }
      .npc3 { fill: #c94545; }
      .npc4 { fill: #f2f2f2; }
      text { font-family: monospace; }
    </style>
  </defs>

  <rect width="960" height="720" class="soil"/>

  <!-- outer grass bands -->
  <rect x="0" y="262" width="960" height="84" class="grass"/>
  <rect x="408" y="0" width="144" height="720" class="grass"/>
  <rect x="0" y="290" width="960" height="14" class="grass2"/>
  <rect x="470" y="0" width="14" height="720" class="grass2"/>

  <!-- central plaza -->
  <rect x="350" y="212" width="260" height="180" class="brick"/>
  <rect x="366" y="228" width="228" height="148" class="brick2"/>
  <rect x="392" y="254" width="166" height="96" class="brick"/>

  <!-- cross roads simplified from map layout -->
  <rect x="0" y="300" width="960" height="8" class="line"/>
  <rect x="472" y="0" width="8" height="720" class="line"/>

  <!-- station square markers -->
  <rect x="428" y="272" width="96" height="56" fill="#d9c36d"/>
  <rect x="444" y="288" width="64" height="24" fill="#b7973f"/>
  <rect x="456" y="296" width="40" height="8" class="line"/>

  <!-- hanok buildings -->
  <g>
    <rect x="86" y="124" width="124" height="94" class="wood"/>
    <rect x="74" y="108" width="148" height="28" class="roof"/>
    <rect x="96" y="146" width="18" height="24" fill="#dbc8a4"/>
    <rect x="120" y="146" width="18" height="24" fill="#dbc8a4"/>
    <rect x="144" y="146" width="18" height="24" fill="#dbc8a4"/>
    <rect x="168" y="146" width="18" height="24" fill="#dbc8a4"/>
  </g>
  <g>
    <rect x="692" y="110" width="144" height="100" class="wood"/>
    <rect x="676" y="92" width="176" height="30" class="roof"/>
    <rect x="710" y="142" width="22" height="24" fill="#dbc8a4"/>
    <rect x="742" y="142" width="22" height="24" fill="#dbc8a4"/>
    <rect x="774" y="142" width="22" height="24" fill="#dbc8a4"/>
  </g>
  <g>
    <rect x="98" y="470" width="132" height="96" class="wood"/>
    <rect x="84" y="452" width="160" height="30" class="roof"/>
    <rect x="118" y="506" width="26" height="22" fill="#dbc8a4"/>
    <rect x="152" y="506" width="26" height="22" fill="#dbc8a4"/>
    <rect x="186" y="506" width="26" height="22" fill="#dbc8a4"/>
  </g>
  <g>
    <rect x="692" y="472" width="158" height="102" class="wood"/>
    <rect x="676" y="452" width="188" height="32" class="roof"/>
    <rect x="716" y="510" width="24" height="22" fill="#dbc8a4"/>
    <rect x="748" y="510" width="24" height="22" fill="#dbc8a4"/>
    <rect x="780" y="510" width="24" height="22" fill="#dbc8a4"/>
