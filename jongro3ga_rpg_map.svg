    <rect x="32" y="598" width="40" height="16" class="grass2"/>
    <rect x="48" y="582" width="10" height="16" class="wood"/>
    <rect x="24" y="614" width="56" height="14" fill="#6f8550"/>
  </g>
  <g>
    <rect x="120" y="610" width="40" height="16" class="grass2"/>
    <rect x="136" y="594" width="10" height="16" class="wood"/>
    <rect x="112" y="626" width="56" height="14" fill="#6f8550"/>
  </g>
  <g>
    <rect x="808" y="606" width="40" height="16" class="grass2"/>
    <rect x="824" y="590" width="10" height="16" class="wood"/>
    <rect x="800" y="622" width="56" height="14" fill="#6f8550"/>
  </g>

  <!-- decorative canal at bottom to echo main road line -->
  <rect x="0" y="650" width="960" height="20" class="water"/>
  <rect x="0" y="670" width="960" height="8" fill="#88bbc9"/>

  <!-- shadows -->
  <rect x="360" y="392" width="240" height="12" class="shadow"/>
  <rect x="94" y="220" width="124" height="10" class="shadow"/>
  <rect x="700" y="212" width="144" height="10" class="shadow"/>

  <!-- title -->
  <rect x="18" y="18" width="248" height="46" fill="#3e2d22"/>
  <text x="34" y="47" font-size="24" fill="#f3dfb0">JONGRO 3-GA VILLAGE</text>
</svg>
