  <g>
    <rect x="324" y="180" width="8" height="92" class="wood"/>
    <rect x="332" y="182" width="18" height="10" class="bannerR"/>
    <rect x="332" y="196" width="14" height="10" class="bannerY"/>
  </g>
  <g>
    <rect x="606" y="356" width="8" height="92" class="wood"/>
    <rect x="614" y="358" width="18" height="10" class="bannerR"/>
    <rect x="614" y="372" width="14" height="10" class="bannerY"/>
  </g>
  <g>
    <rect x="524" y="110" width="8" height="76" class="wood"/>
    <polygon points="528,110 548,126 528,142" class="bannerY"/>
    <polygon points="528,142 548,156 528,170" class="bannerR"/>
  </g>

  <!-- station gate / transfer hub -->
  <g>
    <rect x="404" y="192" width="152" height="42" class="roof"/>
    <rect x="420" y="228" width="120" height="34" class="wood"/>
    <rect x="434" y="236" width="18" height="26" fill="#dbc8a4"/>
    <rect x="470" y="236" width="18" height="26" fill="#dbc8a4"/>
    <rect x="506" y="236" width="18" height="26" fill="#dbc8a4"/>
  </g>

  <!-- small NPCs -->
  <g>
    <rect x="450" y="332" width="10" height="14" class="npc2"/>
    <rect x="448" y="346" width="14" height="14" class="npc4"/>
    <rect x="452" y="328" width="6" height="4" class="line"/>
